# sharp makes the WebP image variants at build time (scripts/optimize-images.ts).
# It ships prebuilt platform binaries, so its build script is not required.
# unrs-resolver (eslint) ships prebuilt binaries.
# esbuild (via tsx, for the scripts/ tooling) verifies its platform binary on
# install, so it is allowed to run.
allowBuilds:
  esbuild: true
  sharp: false
  unrs-resolver: false
