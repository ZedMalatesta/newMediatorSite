name: Check and deploy

on:
  # Every pull request runs the checks a deploy runs, so a problem shows on the
  # PR instead of stopping the deploy after the merge. Only main deploys.
  pull_request:
  push:
    branches: [main]
  # Event status (upcoming / open / past) is worked out from dates at build
  # time, so a finished event stays "open" until the next build. Rebuild every
  # night, 03:00 Minsk. GitHub pauses schedules after 60 days without commits.
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A newer push replaces a run still in progress: per pull request, and for
  # the site.
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'pages' }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, test, build, links, audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run lint

      # Unit and component tests; fails below 90% coverage on any measure
      # (thresholds in vitest.config.mts).
      - run: pnpm run test:coverage

      # The build re-encodes only pictures that changed since the cached run
      # (scripts/optimize-images.ts); a cold run encodes all of them.
      - uses: actions/cache@v4
        with:
          path: |
            public/optimized
            .cache/optimized-images.json
          key: images-${{ hashFiles('public/images/**', 'app/lib/imageVariants.ts', 'scripts/optimize-images.ts') }}
          restore-keys: images-

      # Pages serves this project under /newMediatorSite/, so the export needs a
      # matching base path. Local builds leave BASE_PATH unset and stay at root.
      - run: pnpm run build
        env:
          BASE_PATH: /newMediatorSite

      # A link without the base path, or to a page that was not exported, 404s
      # only once deployed - neither the build nor lint can see it. Fail here.
      - run: python3 scripts/check-links.py /newMediatorSite

      # A live section shown twice or not at all, a picture missing or cut to
      # a box: the pages still build and every link still works. Fail here.
      - run: pnpm run audit:pages

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: out

  deploy:
    if: github.event_name != 'pull_request'
    needs: checks
    runs-on: ubuntu-latest
    # Only this job can publish the site.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
